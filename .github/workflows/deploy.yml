name: Deploy

on:
  workflow_dispatch:
    inputs:
      force_android:
        description: Publish a new APK even when android/ has not changed
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: rodzina-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Require main
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: test "$DEPLOY_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether to publish Android
        id: android
        shell: bash
        env:
          FORCE_ANDROID: ${{ inputs.force_android }}
          GH_TOKEN: ${{ github.token }}
        run: |
          publish=false
          if [[ "$FORCE_ANDROID" == true ]]; then
            publish=true
          else
            previous=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&event=workflow_dispatch&status=success" \
              --jq '.workflow_runs[] | [.updated_at, .head_sha] | @tsv' |
              LC_ALL=C sort -r | awk 'NR == 1 { print $2 }')
            if [[ -z "$previous" ]]; then
              echo 'No successful Deploy to compare. Use force_android to publish an APK.'
            else
              previous_tree=$(git rev-parse --verify "$previous:android")
              current_tree=$(git rev-parse --verify HEAD:android)
              if [[ "$previous_tree" != "$current_tree" ]]; then
                publish=true
              fi
            fi
          fi
          echo "Publish Android: $publish"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run release:smoke
      - uses: actions/setup-java@v4
        if: steps.android.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: steps.android.outputs.publish == 'true'
      - uses: android-actions/setup-android@v3
        if: steps.android.outputs.publish == 'true'
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
        if: steps.android.outputs.publish == 'true'
      - run: chmod +x android/gradlew
        if: steps.android.outputs.publish == 'true'
      - name: Build and verify signed Android release
        if: steps.android.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_CERTIFICATE_SHA256: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
        run: node scripts/android-ci.mjs
      - run: ./gradlew testDebugUnitTest lintDebug --no-daemon --no-configuration-cache
        if: steps.android.outputs.publish == 'true'
        working-directory: android
      - name: Deploy checked release
        env:
          DEPLOY_ANDROID_RELEASE: ${{ steps.android.outputs.publish == 'true' && 'android-releases/deploy/latest.json' || '' }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_NODE: ${{ vars.DEPLOY_NODE }}
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: node scripts/deploy.mjs
