import org.gradle.api.artifacts.repositories.MavenArtifactRepository

// Apply before each buildscript, including Capacitor projects generated by sync.
gradle.beforeProject { project ->
    [project.buildscript.repositories, project.repositories].each { repositories ->
        repositories.withType(MavenArtifactRepository).configureEach { repository ->
            if (repository.url.toString().replaceAll('/+$', '') in [
                'https://repo.maven.apache.org/maven2',
                'https://repo1.maven.org/maven2'
            ]) {
                repository.setUrl('https://maven-central.storage-download.googleapis.com/maven2/')
            }
        }
    }
}
